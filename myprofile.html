<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeartMatch - My Profile</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#e91e63;
}

.profile-img{
    display:block;
    width:120px;
    height:120px;
    border-radius:50%;
    margin:20px auto;
    border:3px solid #e91e63;
}

table{
    width:100%;
    border-collapse:collapse;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.label{
    font-weight:bold;
    color:#e91e63;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#e91e63;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#c2185b;
}

#loading{
    text-align:center;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

<h2>My Profile</h2>

<img src="https://via.placeholder.com/120"
     class="profile-img"
     alt="Profile Photo">

<p id="loading">Loading profile...</p>

<table id="profileTable" style="display:none;">

<tr>
<td class="label">Full Name</td>
<td id="name">-</td>
</tr>

<tr>
<td class="label">Age</td>
<td id="age">-</td>
</tr>

<tr>
<td class="label">Date of Birth</td>
<td id="dob">-</td>
</tr>

<tr>
<td class="label">Religion</td>
<td id="religion">-</td>
</tr>

<tr>
<td class="label">Caste</td>
<td id="caste">-</td>
</tr>

<tr>
<td class="label">Rashi</td>
<td id="rashi">-</td>
</tr>

<tr>
<td class="label">Nakshatra</td>
<td id="nakshatra">-</td>
</tr>

<tr>
<td class="label">Education</td>
<td id="education">-</td>
</tr>

<tr>
<td class="label">Occupation</td>
<td id="occupation">-</td>
</tr>

<tr>
<td class="label">Family Details</td>
<td id="family">-</td>
</tr>

<tr>
<td class="label">Contact Number</td>
<td id="phone">-</td>
</tr>

<tr>
<td class="label">Email</td>
<td id="email">-</td>
</tr>

<tr>
<td class="label">Address</td>
<td id="address">-</td>
</tr>

<tr>
<td class="label">Marital Status</td>
<td id="status">-</td>
</tr>

</table>

<button onclick="window.location.href='profile.html'">
    Edit Profile
</button>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const loading = document.getElementById("loading");
const table = document.getElementById("profileTable");


onAuthStateChanged(auth, async (user) => {

    if (!user) {

        alert("Please login first.");

        window.location.href = "login.html";

        return;
    }

    try {

        const userRef = doc(db, "users", user.uid);

        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {

            loading.innerText =
                "No profile found. Please create your profile.";

            return;
        }

        const data = userSnap.data();


        document.getElementById("name").innerText =
            data.name || "-";

        document.getElementById("age").innerText =
            data.age || "-";

        document.getElementById("dob").innerText =
            data.dob || "-";

        document.getElementById("religion").innerText =
            data.religion || "-";

        document.getElementById("caste").innerText =
            data.caste || "-";

        document.getElementById("rashi").innerText =
            data.rashi || "-";

        document.getElementById("nakshatra").innerText =
            data.nakshatra || "-";

        document.getElementById("education").innerText =
            data.education || "-";

        document.getElementById("occupation").innerText =
            data.occupation || "-";

        document.getElementById("family").innerText =
            data.family || "-";

        document.getElementById("phone").innerText =
            data.phone || "-";

        document.getElementById("email").innerText =
            data.email || user.email || "-";

        document.getElementById("address").innerText =
            data.address || "-";

        document.getElementById("status").innerText =
            data.status || "-";


        loading.style.display = "none";

        table.style.display = "table";


    } catch (error) {

        console.error("Error loading profile:", error);

        loading.innerText =
            "Unable to load profile: " + error.message;

    }

});

</script>

</body>
</html>
