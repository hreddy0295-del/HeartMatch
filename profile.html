<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HeartMatch - Create Profile</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#e91e63;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#e91e63;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#c2185b;
}
</style>
</head>

<body>

<div class="container">

<h2>Create / Edit Profile</h2>

<form id="profileForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Age</label>
<input type="number" id="age" required>

<label>Date of Birth</label>
<input type="date" id="dob">

<label>Religion</label>
<input type="text" id="religion">

<label>Caste</label>
<input type="text" id="caste">

<label>Rashi</label>
<input type="text" id="rashi">

<label>Nakshatra</label>
<input type="text" id="nakshatra">

<label>Education</label>
<input type="text" id="education">

<label>Occupation</label>
<input type="text" id="occupation">

<label>Family Details</label>
<textarea id="family"></textarea>

<label>Contact Number</label>
<input type="tel" id="phone">

<label>Email</label>
<input type="email" id="email">

<label>Address</label>
<textarea id="address"></textarea>

<label>Marital Status</label>
<select id="status">
    <option value="">Select Status</option>
    <option value="Never Married">Never Married</option>
    <option value="Divorced">Divorced</option>
    <option value="Widowed">Widowed</option>
</select>

<button type="submit">Save Profile</button>

</form>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


let currentUser = null;


/* Check logged-in user */
onAuthStateChanged(auth, (user) => {

    if (user) {

        currentUser = user;

        console.log("Logged-in user:", user.uid);

    } else {

        currentUser = null;

        console.log("No user is logged in.");

    }

});


/* Save profile */
document.getElementById("profileForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    if (!currentUser) {

        alert("Please login first.");

        window.location.href = "login.html";

        return;
    }


    try {

        const profileData = {

            name: document.getElementById("name").value.trim(),

            age: document.getElementById("age").value,

            dob: document.getElementById("dob").value,

            religion: document.getElementById("religion").value.trim(),

            caste: document.getElementById("caste").value.trim(),

            rashi: document.getElementById("rashi").value.trim(),

            nakshatra: document.getElementById("nakshatra").value.trim(),

            education: document.getElementById("education").value.trim(),

            occupation: document.getElementById("occupation").value.trim(),

            family: document.getElementById("family").value.trim(),

            phone: document.getElementById("phone").value.trim(),

            email: document.getElementById("email").value.trim(),

            address: document.getElementById("address").value.trim(),

            status: document.getElementById("status").value,

            uid: currentUser.uid

        };


        /* Save to Firestore */
        await setDoc(
            doc(db, "users", currentUser.uid),
            profileData,
            { merge: true }
        );


        alert("Profile saved successfully!");


        /* Open My Profile page */
        window.location.href = "myprofile.html";


    } catch (error) {

        console.error("Error saving profile:", error);

        alert("Unable to save profile.\n\n" + error.message);

    }

});

</script>

</body>
</html>
