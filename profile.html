<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeartMatch - Create Profile</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#e91e63;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#e91e63;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#c2185b;
}
</style>
</head>

<body>

<div class="container">

<h2>Create / Edit Profile</h2>

<form id="profileForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Age</label>
<input type="number" id="age" required>

<label>Date of Birth</label>
<input type="date" id="dob">

<label>Religion</label>
<input type="text" id="religion">

<label>Caste</label>
<input type="text" id="caste">

<label>Rashi</label>
<input type="text" id="rashi">

<label>Nakshatra</label>
<input type="text" id="nakshatra">

<label>Education</label>
<input type="text" id="education">

<label>Occupation</label>
<input type="text" id="occupation">

<label>Family Details</label>
<textarea id="family"></textarea>

<label>Contact Number</label>
<input type="tel" id="phone">

<label>Email</label>
<input type="email" id="email">

<label>Address</label>
<textarea id="address"></textarea>

<label>Marital Status</label>
<select id="status">
<option>Never Married</option>
<option>Divorced</option>
<option>Widowed</option>
</select>

<button type="submit">Save Profile</button>

</form>

</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("profileForm");

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        alert("Please login first.");
        window.location.href = "login.html";
        return;
    }

    try {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {

            const data = userSnap.data();

            document.getElementById("name").value = data.name || "";
            document.getElementById("age").value = data.age || "";
            document.getElementById("dob").value = data.dob || "";
            document.getElementById("religion").value = data.religion || "";
            document.getElementById("caste").value = data.caste || "";
            document.getElementById("rashi").value = data.rashi || "";
            document.getElementById("nakshatra").value = data.nakshatra || "";
            document.getElementById("education").value = data.education || "";
            document.getElementById("occupation").value = data.occupation || "";
            document.getElementById("family").value = data.family || "";
            document.getElementById("phone").value = data.phone || "";
            document.getElementById("email").value = data.email || user.email || "";
            document.getElementById("address").value = data.address || "";
            document.getElementById("status").value = data.status || "Never Married";

        } else {
            document.getElementById("email").value = user.email || "";
        }

    } catch (error) {
        console.error(error);
        alert("Unable to load profile: " + error.message);
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        try {

            const profileData = {
                name: document.getElementById("name").value,
                age: document.getElementById("age").value,
                dob: document.getElementById("dob").value,
                religion: document.getElementById("religion").value,
                caste: document.getElementById("caste").value,
                rashi: document.getElementById("rashi").value,
                nakshatra: document.getElementById("nakshatra").value,
                education: document.getElementById("education").value,
                occupation: document.getElementById("occupation").value,
                family: document.getElementById("family").value,
                phone: document.getElementById("phone").value,
                email: document.getElementById("email").value,
                address: document.getElementById("address").value,
                status: document.getElementById("status").value
            };

            await setDoc(doc(db, "users", user.uid), profileData, { merge: true });

            alert("Profile updated successfully!");

            window.location.href = "myprofile.html";

        } catch (error) {
            console.error(error);
            alert("Unable to save profile: " + error.message);
        }
    });
});
</script>

</body>
</html>
